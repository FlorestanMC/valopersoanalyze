<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2d6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ranked" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4655"/>
      <stop offset="100%" stop-color="#ff2d8e"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>

  <!-- fond aurora -->
  <rect width="1200" height="700" fill="#07060f"/>
  <g filter="url(#blur)" opacity="0.55">
    <ellipse cx="180" cy="90" rx="330" ry="300" fill="url(#b1)"/>
    <ellipse cx="1050" cy="640" rx="300" ry="280" fill="url(#b2)"/>
    <ellipse cx="880" cy="230" rx="240" ry="220" fill="url(#b3)"/>
  </g>
  <rect width="1200" height="700" fill="#07060f" opacity="0.32"/>

  <!-- header -->
  <text x="48" y="52" fill="#FF4655" font-size="13" font-weight="800" letter-spacing="3">◆ VALO STATS</text>
  <text x="47" y="90" fill="#F2F0EA" font-size="34" font-weight="800">Mata#AAAAA</text>
  <!-- pills -->
  <g font-size="12" font-weight="800">
    <rect x="48" y="104" width="96" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#9fd8ff" stroke-opacity="0.4"/>
    <text x="96" y="121" fill="#9fd8ff" text-anchor="middle">Diamond 3</text>
    <rect x="152" y="104" width="94" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="199" y="121" fill="#F2F0EA" text-anchor="middle">Niveau 257</text>
    <rect x="254" y="104" width="104" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#37E0A6" stroke-opacity="0.4"/>
    <text x="306" y="121" fill="#37E0A6" text-anchor="middle">Saison e11a4</text>
  </g>
  <!-- queue switch -->
  <g font-size="13" font-weight="800">
    <rect x="980" y="44" width="172" height="40" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="985" y="49" width="82" height="30" rx="9" fill="url(#ranked)"/>
    <text x="1026" y="69" fill="#ffffff" text-anchor="middle">Ranked</text>
    <text x="1112" y="69" fill="#98a2b3" text-anchor="middle">Premier</text>
  </g>

  <!-- tabs -->
  <g font-size="14" font-weight="800">
    <rect x="48" y="150" width="150" height="42" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="123" y="177" fill="#ffffff" text-anchor="middle">Vue d'ensemble</text>
    <text x="250" y="177" fill="#98a2b3">Agents</text>
    <text x="340" y="177" fill="#98a2b3">Armes</text>
    <text x="430" y="177" fill="#98a2b3">First Contact</text>
  </g>

  <!-- hero: win rate -->
  <rect x="48" y="212" width="640" height="168" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="72" y="250" fill="#98a2b3" font-size="12" font-weight="800" letter-spacing="2">WIN RATE · 43 PARTIES</text>
  <text x="70" y="326" fill="#FF4655" font-size="72" font-weight="800">41.9%</text>
  <text x="72" y="360" fill="#98a2b3" font-size="15" font-weight="600">18 victoires · 25 défaites</text>

  <!-- hero: rounds -->
  <rect x="704" y="212" width="448" height="168" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="728" y="262" fill="#F2F0EA" font-size="34" font-weight="800">48.8 %</text>
  <text x="840" y="262" fill="#98a2b3" font-size="14" font-weight="600">round win rate</text>
  <rect x="728" y="286" width="400" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="728" y="286" width="195" height="14" rx="7" fill="#37E0A6"/>
  <rect x="923" y="286" width="205" height="14" rx="7" fill="#FF4655"/>
  <text x="728" y="332" fill="#37E0A6" font-size="13" font-weight="700">442 rounds gagnés</text>
  <text x="1128" y="332" fill="#FF4655" font-size="13" font-weight="700" text-anchor="end">463 perdus</text>

  <!-- KPI tiles -->
  <g>
    <!-- tile template: 175 wide, gap 14, start x48 -->
    <g>
      <rect x="48" y="400" width="175" height="96" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="66" y="428" fill="#98a2b3" font-size="12" font-weight="700">K/D</text>
      <text x="66" y="462" fill="#F2F0EA" font-size="28" font-weight="800">1.15</text>
      <text x="66" y="482" fill="#98a2b3" font-size="11">KDA 1.45</text>
    </g>
    <g>
      <rect x="237" y="400" width="175" height="96" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="255" y="428" fill="#98a2b3" font-size="12" font-weight="700">ACS moyen</text>
      <text x="255" y="462" fill="#F2F0EA" font-size="28" font-weight="800">232</text>
      <text x="255" y="482" fill="#98a2b3" font-size="11">score / round</text>
    </g>
    <g>
      <rect x="426" y="400" width="175" height="96" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="444" y="428" fill="#98a2b3" font-size="12" font-weight="700">KAST</text>
      <text x="444" y="462" fill="#37E0A6" font-size="28" font-weight="800">71.8 %</text>
      <text x="444" y="482" fill="#98a2b3" font-size="11">rounds impactés</text>
    </g>
    <g>
      <rect x="615" y="400" width="175" height="96" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="633" y="428" fill="#98a2b3" font-size="12" font-weight="700">HS %</text>
      <text x="633" y="462" fill="#F2F0EA" font-size="28" font-weight="800">26.7 %</text>
      <text x="633" y="482" fill="#98a2b3" font-size="11">précision tête</text>
    </g>
    <g>
      <rect x="804" y="400" width="175" height="96" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="822" y="428" fill="#98a2b3" font-size="12" font-weight="700">Kills / partie</text>
      <text x="822" y="462" fill="#F2F0EA" font-size="28" font-weight="800">17.4</text>
      <text x="822" y="482" fill="#98a2b3" font-size="11">15.1 D · 4.4 A</text>
    </g>
    <g>
      <rect x="993" y="400" width="159" height="96" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="1011" y="428" fill="#98a2b3" font-size="12" font-weight="700">First Contact</text>
      <text x="1011" y="462" fill="#37E0A6" font-size="28" font-weight="800">59.2 %</text>
      <text x="1011" y="482" fill="#98a2b3" font-size="11">onglet dédié ↗</text>
    </g>
  </g>

  <!-- win rate par carte (mini) -->
  <rect x="48" y="516" width="560" height="150" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="72" y="548" fill="#98a2b3" font-size="12" font-weight="800" letter-spacing="2">WIN RATE PAR CARTE</text>
  <g font-size="13" font-weight="700">
    <text x="72" y="580" fill="#F2F0EA">Sunset</text>
    <rect x="150" y="571" width="330" height="9" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="150" y="571" width="264" height="9" rx="5" fill="#37E0A6"/>
    <text x="588" y="580" fill="#F2F0EA" text-anchor="end">80 %</text>
    <text x="72" y="608" fill="#F2F0EA">Lotus</text>
    <rect x="150" y="599" width="330" height="9" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="150" y="599" width="206" height="9" rx="5" fill="#37E0A6"/>
    <text x="588" y="608" fill="#F2F0EA" text-anchor="end">62.5 %</text>
    <text x="72" y="636" fill="#F2F0EA">Breeze</text>
    <rect x="150" y="627" width="330" height="9" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="150" y="627" width="94" height="9" rx="5" fill="#FF4655"/>
    <text x="588" y="636" fill="#F2F0EA" text-anchor="end">28.6 %</text>
  </g>

  <!-- first contact mini -->
  <rect x="624" y="516" width="528" height="150" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="648" y="548" fill="#98a2b3" font-size="12" font-weight="800" letter-spacing="2">FIRST CONTACT</text>
  <circle cx="712" cy="606" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="12"/>
  <circle cx="712" cy="606" r="46" fill="none" stroke="#37E0A6" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="171 289" transform="rotate(-90 712 606)"/>
  <text x="712" y="600" fill="#37E0A6" font-size="22" font-weight="800" text-anchor="middle">59%</text>
  <text x="712" y="620" fill="#98a2b3" font-size="10" text-anchor="middle">FCS</text>
  <g font-size="14" font-weight="700">
    <circle cx="812" cy="588" r="5" fill="#37E0A6"/>
    <text x="826" y="593" fill="#F2F0EA">135 First Kills</text>
    <circle cx="812" cy="620" r="5" fill="#FF4655"/>
    <text x="826" y="625" fill="#F2F0EA">93 First Deaths</text>
  </g>

  <text x="600" y="690" fill="#6b7280" font-size="11" text-anchor="middle">Aperçu — l'application est interactive (onglets, sélecteur de file, fond personnalisable, mise à jour en direct)</text>
</svg>
